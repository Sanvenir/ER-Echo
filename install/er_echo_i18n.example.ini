# ============================================================
# ER Echo — 菜单文案覆盖示例（可选）
# 用法：
#   1) 复制本文件为 er_echo_i18n.ini（游戏根目录，和 er_echo.dll 同级）
#   2) 把 er_echo.ini 里 [i18n] 的 language 改成下面的语言代码
#   3) 重启游戏（DLL 启动时读一次）
# 只写想改的键；没写的键回退内置（zh-CN / zh-TW / en / ja），再回退英文。
# 占位符 {count} {n} {i} {name} {level} {preset} 不要翻译、不要删。
# 键表见 er-echo/docs/i18n.md。
# ============================================================

[en]
; root=Comrades ({count}/{n})
; count_row=Party size: {count} (click to change)
; slot=Slot {i}: {name} (click to change)
; resummon=Resummon now
; friendly_fire_on=Friendly fire: ON ({rate}% damage, click to disable)
; friendly_fire_off=Friendly fire: OFF (click to enable)
; back=Back
; count_none=Don't summon
; count_n=Party of {count}
; profile={name}  Lv{level}
; ai_menu=Companion AI (click to open)
; ai_slot=Slot {i} {name}: {preset} (click to change)
; ai_default=Default
; ai_custom=Custom
; ai_balanced=Balanced
; ai_melee=Melee
; ai_caster=Caster
; ai_guardian=Guardian
; ai_aggressive=Aggressive

